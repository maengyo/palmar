<!doctype html><meta charset="utf-8">
<title>palmar — social card</title>
<!--
  The picture GitHub shows when somebody pastes a link to the repository, and the only place it can
  be set is Settings -> General -> Social preview. 1280x640 is what GitHub asks for.

  **The icon is not copied in here.** It is the same file the web app and the Dock tile use, so
  there is one image to keep in step — the rule the Dock tile already follows. Rendered with
  `dev/social-card.py`, which opens this page in Chrome and takes a 1280x640 shot of it.

  The colours are the app's own tokens, read out of palmar/web/style.css: --canvas, --dot, --ink,
  --ink-2, --ink-3, and the four status colours, which are the thing the page is about.
-->
<style>
  html,body{margin:0;padding:0}
  body{width:1280px;height:640px;overflow:hidden;
       background:#ecebe5;                                   /* --canvas */
       background-image:radial-gradient(#d3cfc5 1.4px, transparent 1.6px);   /* --dot */
       background-size:32px 32px; background-position:16px 16px;
       font:400 16px/1.4 -apple-system,"Helvetica Neue",Arial,sans-serif; color:#1f2229;
       display:flex; align-items:center; justify-content:center;}
  .card{display:flex; align-items:center; gap:56px;}
  .mark{width:236px;height:236px;border-radius:52px;
        box-shadow:0 18px 48px rgba(31,34,41,.16), 0 2px 0 rgba(255,255,255,.7) inset;}
  .name{font-size:112px; font-weight:700; letter-spacing:-.035em; line-height:1; color:#1f2229;}
  .line{margin-top:20px; font-size:31px; line-height:1.34; color:#4f5563; max-width:16ch;}
  .lights{margin-top:30px; display:flex; align-items:center; gap:13px;}
  .lights i{width:17px;height:17px;border-radius:50%;display:block}
  .lights b{font-weight:500;font-size:23px;color:#656a7a;margin-left:5px;letter-spacing:.01em}
</style>
<div class="card">
  <img class="mark" src="../palmar/web/icon-512.png" alt="">
  <div>
    <div class="name">palmar</div>
    <div class="line">Many terminals, one place.</div>
    <div class="lights">
      <i style="background:#2f7d3a"></i><i style="background:#a8730f"></i>
      <i style="background:#c0392f"></i><i style="background:#a4a8b3"></i>
      <b>and you can see which one wants you</b>
    </div>
  </div>
</div>
