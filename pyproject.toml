[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palmar"
dynamic = ["version"]
description = "A light way to keep a lot of terminals in one place. Not an AI tool — it runs no model and sends nothing anywhere."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "maengyo" }]
keywords = ["terminal", "pty", "canvas", "tmux-alternative", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Topic :: Terminals :: Terminal Emulators/X Terminals",
  "Topic :: Utilities",
]
# 의존성은 **없다.** 이 줄이 비어 있는 것이 이 프로젝트의 성질이다 — 표준 라이브러리만 쓰고,
# xterm.js 는 palmar/web/vendor/ 에 들어 있어 실행할 때 아무것도 받아 오지 않는다.
dependencies = []

[project.scripts]
palmar = "palmar.daemon:cli"

[project.urls]
Homepage = "https://github.com/maengyo/palmar"
Issues = "https://github.com/maengyo/palmar/issues"

[tool.hatch.version]
path = "palmar/__init__.py"

[tool.hatch.build.targets.wheel]
# 패키지 하나가 전부다. palmar/web/ 도 이 안에 있으므로 따로 적을 것이 없다 —
# 소스와 설치본의 모양이 같아야 `WEB` 이 두 곳에서 같은 자리를 가리킨다.
packages = ["palmar"]

[tool.hatch.build.targets.sdist]
include = [
  "/palmar",
  "/docs",
  "/dev",
  "/AGENTS.md",
  "/README.md",
  "/README.ko.md",
  "/LICENSE",
]
