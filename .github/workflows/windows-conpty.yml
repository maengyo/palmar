# palmar/conpty.py, on the only machine that can run it.
#
# **Split out of windows-probe.yml so a round costs a minute.** That workflow installs pywinpty and
# runs the eleven-section probe first, which is 84 seconds of answers this file does not need; this
# one needs nothing but a checkout and the Python already on the image. Set-up is about 18 seconds.
#
# `sections` picks which parts run — one question per round is what made this expensive, so ask for
# the question you want:
#
#     gh workflow run windows-conpty.yml -f sections="steps attached"
#     gh run watch
#
# The check carries its own watchdog, so a blocked ReadFile prints a line and exits instead of
# sitting until the job's timeout. Every earlier round died that way.
name: conpty (windows)

on:
  workflow_dispatch:
    inputs:
      sections:
        description: "Which sections to run (blank = all). e.g. steps attached"
        type: string
        default: ""
  push:
    paths:
      - "palmar/conpty.py"
      - "dev/conpty-check.py"
      - "install.ps1"
      - ".github/workflows/windows-conpty.yml"

jobs:
  conpty:
    runs-on: windows-latest
    timeout-minutes: 6          # the check's own watchdog fires long before this

    steps:
      - uses: actions/checkout@v4

      - name: what python is here
        run: python --version

      # **Windows PowerShell 5.1, not PowerShell 7.** A Mac can only test install.ps1 against pwsh 7,
      # and 5.1 is what a Windows machine has built in — `$IsWindows` does not exist there, native
      # stderr behaves differently, and Join-Path takes two arguments and no more. The script errored
      # out on a real 5.1 machine while the same file ran clean under 7.6 here (user, 2026-09-14), so
      # the only way to stop guessing is to run it where it broke.
      #
      # `-Check` writes nothing, which is why this can run on every push without leaving anything on
      # the runner. `continue-on-error` because the report is the point: a non-zero exit here should
      # print what went wrong, not hide it behind a failed job.
      - name: install.ps1 under PowerShell 5.1
        continue-on-error: true
        shell: cmd
        run: |
          echo --- version
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$PSVersionTable.PSVersion | Format-List"
          echo --- parse
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'install.ps1').Path,[ref]$t,[ref]$e)|Out-Null;if($e){$e|ForEach-Object{'{0}: {1}' -f $_.Extent.StartLineNumber,$_.Message}}else{'parses clean on 5.1'}"
          echo --- run
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Check

      # No pip install of anything: this half of the port is ctypes against kernel32, which is the
      # whole point of writing it.
      - name: conpty
        env:
          CONPTY_WATCHDOG: "120"
        run: python -u dev\conpty-check.py ${{ inputs.sections }}
