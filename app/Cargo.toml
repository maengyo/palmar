# palmar's window.
#
# **Not Electron** (decisions.md: cate ships a 496MB dmg and installs 1.1GB — being heavy is the
# thing this project is avoiding) and not the Tauri CLI either: there is no JavaScript to build and
# no frontend to bundle, because the UI is already served by the daemon. What is left is exactly two
# things — a window (tao) and a webview (wry) — which is what Tauri itself is built on.
#
# The system webview does the rendering, so nothing is shipped twice:
#   macOS   WKWebView            (in the OS)
#   Linux   WebKitGTK 4.1        (libwebkit2gtk-4.1-0, and -dev to build) — this is the WSLg case
#   Windows WebView2             (native port is #29; today, run the daemon in WSL)
#
# Licences: tao and wry are Apache-2.0/MIT, the same terms as palmar's MIT. Nothing is vendored here
# — cargo fetches them — so there is no third-party notice to carry in-tree for this crate.
[package]
name = "palmar-app"
version = "0.1.1"
edition = "2021"
description = "palmar in its own window"
license = "MIT"

[[bin]]
name = "palmar-app"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = "0.45"

# flock on ~/.palmar/run/lock: the one thing that says a daemon is alive (see daemon_alive). Already
# in the tree through tao and wry; naming it here only makes the call ours to write.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS only, and only to put an icon in the Dock. This binary is **not a .app bundle** — it is one
# Mach-O file — so macOS has no Info.plist to read an icon out of and shows the generic executable
# icon instead ("mac에서는 palmar app 로고가 제대로 적용이 안되어있고", 2026-09-16). tao cannot help:
# its set_window_icon is an empty function on macOS ("macOS doesn't have window icons"). The Dock
# tile is set through AppKit at start-up instead. **No new dependency tree** — cargo already builds
# both of these for tao; naming them here only makes the call ours to write.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

# Linux only, and only to undo one line inside wry: it disables the IME preedit unconditionally
# (webkitgtk/mod.rs:360, "fcitx input editor can anchor at edit cursor position"), which leaves ibus
# users with no composing syllable on screen. Reaching the setting needs wry's own WebView type, so
# this must be **the same crate at the same version with the same features wry builds it with** —
# `=2.0.1` from app/Cargo.lock, `v2_40` from wry's own feature list — or the types do not unify.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.1", features = ["v2_40"] }

# A window is not a hot loop. Optimising for size keeps the binary in the same order of magnitude as
# the thing it replaces a 1.1GB install with.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
